<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- Dark background -->
  <rect width="32" height="32" rx="6" fill="#1a2535"/>

  <!-- CPU chip body -->
  <rect x="9" y="9" width="14" height="14" rx="2" fill="#3d9cf4" opacity="0.15"/>
  <rect x="9" y="9" width="14" height="14" rx="2" stroke="#3d9cf4" stroke-width="1.5"/>

  <!-- Inner chip grid lines -->
  <line x1="13" y1="9" x2="13" y2="23" stroke="#3d9cf4" stroke-width="0.75" opacity="0.5"/>
  <line x1="16" y1="9" x2="16" y2="23" stroke="#3d9cf4" stroke-width="0.75" opacity="0.5"/>
  <line x1="19" y1="9" x2="19" y2="23" stroke="#3d9cf4" stroke-width="0.75" opacity="0.5"/>
  <line x1="9" y1="13" x2="23" y2="13" stroke="#3d9cf4" stroke-width="0.75" opacity="0.5"/>
  <line x1="9" y1="16" x2="23" y2="16" stroke="#3d9cf4" stroke-width="0.75" opacity="0.5"/>
  <line x1="9" y1="19" x2="23" y2="19" stroke="#3d9cf4" stroke-width="0.75" opacity="0.5"/>

  <!-- Top pins -->
  <line x1="12" y1="6" x2="12" y2="9" stroke="#3d9cf4" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="16" y1="6" x2="16" y2="9" stroke="#3d9cf4" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="20" y1="6" x2="20" y2="9" stroke="#3d9cf4" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Bottom pins -->
  <line x1="12" y1="23" x2="12" y2="26" stroke="#3d9cf4" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="16" y1="23" x2="16" y2="26" stroke="#3d9cf4" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="20" y1="23" x2="20" y2="26" stroke="#3d9cf4" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Left pins -->
  <line x1="6" y1="12" x2="9" y2="12" stroke="#3d9cf4" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="6" y1="16" x2="9" y2="16" stroke="#3d9cf4" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="6" y1="20" x2="9" y2="20" stroke="#3d9cf4" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Right pins -->
  <line x1="23" y1="12" x2="26" y2="12" stroke="#3d9cf4" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="23" y1="16" x2="26" y2="16" stroke="#3d9cf4" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="23" y1="20" x2="26" y2="20" stroke="#3d9cf4" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Center core -->
  <rect x="13" y="13" width="6" height="6" rx="1" fill="#3d9cf4"/>
</svg>